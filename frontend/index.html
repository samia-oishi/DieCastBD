<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Every page hits the API and Cloudinary immediately — warming the
         connection (DNS + TLS) ahead of the actual request shaves latency
         off the first API call and the first product image. -->
    <link rel="preconnect" href="https://api.diecastbd.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.diecastbd.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>DiecastBD — Premium Diecast Collectibles</title>
    
    <!-- Defaults for crawlers/social that don't run JS; react-helmet-async
         overrides these per page (e.g. product titles/descriptions) at runtime. -->
    <meta
      name="description"
      content="Premium 1:64 diecast collectibles in Bangladesh — authentic Hot Wheels Premium and MINI GT, curated for collectors."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DiecastBD" />
    <meta property="og:title" content="DiecastBD — Premium Diecast Collectibles" />
    <meta
      property="og:description"
      content="Authentic Hot Wheels Premium and MINI GT diecast, curated for collectors. Nationwide delivery across Bangladesh."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
