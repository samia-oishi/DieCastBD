<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF7" />
    <title>DiecastBD — Premium Diecast Collectibles</title>

    <!-- Storefront redesign fonts (design_handoff_diecastbd_storefront) — Archivo for
         headings/display, Instrument Sans for body. Admin keeps Geist (Fontsource,
         loaded via index.css) and never references these. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Defaults for crawlers/social that don't run JS; react-helmet-async
         overrides these per page (e.g. product titles/descriptions) at runtime. -->
    <meta
      name="description"
      content="Premium 1:64 diecast collectibles in Bangladesh — authentic Hot Wheels Premium and MINI GT, curated for collectors."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DiecastBD" />
    <meta property="og:title" content="DiecastBD — Premium Diecast Collectibles" />
    <meta
      property="og:description"
      content="Authentic Hot Wheels Premium and MINI GT diecast, curated for collectors. Nationwide delivery across Bangladesh."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
